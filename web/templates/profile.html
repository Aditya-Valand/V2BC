{% extends "base.html" %}

{% block title %}Business Setup - BharatCompliance{% endblock %}

{% block content %}
<section class="flex flex-col items-center py-12 px-6 min-h-screen relative overflow-hidden"
    x-data="multiStepOnboarding()">

    <!-- Header/Progress Section -->
    <div class="w-full max-w-xl mb-8 fade-in-up relative z-10">
        <div class="flex justify-between items-end mb-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight" x-text="stepTitle()"></h1>
                <div class="flex items-center gap-2 mt-2">
                    <span
                        class="px-2.5 py-0.5 rounded-md bg-indigo-50 text-indigo-700 text-xs font-bold uppercase tracking-wide border border-indigo-100"
                        x-text="'Step ' + step + ' of 4'"></span>
                </div>
            </div>
            <span class="text-indigo-600 font-bold text-xl" x-text="Math.round(progress) + '%'"></span>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-white/50 h-3 rounded-full overflow-hidden p-0.5 shadow-sm border border-white">
            <div class="bg-gradient-to-r from-indigo-500 to-indigo-600 h-full rounded-full transition-all duration-700 ease-in-out shadow-[0_0_10px_rgba(99,102,241,0.5)] relative"
                :style="'width: ' + progress + '%'">
                <div class="absolute inset-0 bg-white/20 animate-[shimmer_2s_infinite]"></div>
            </div>
        </div>
    </div>

    <!-- Main Card -->
    <div class="glass-panel w-full max-w-xl p-8 rounded-[2rem] shadow-xl shadow-indigo-100/50 border border-white min-h-[600px] flex flex-col relative overflow-hidden fade-in-up"
        style="animation-delay: 0.1s;">

        <form @submit.prevent="submitForm" class="flex-1 flex flex-col relative z-10">

            <!-- Step 1: About You -->
            <div x-show="step === 1" x-transition:enter="transition ease-out duration-500 delay-200"
                x-transition:enter-start="opacity-0 translate-x-8" x-transition:enter-end="opacity-100 translate-x-0"
                x-transition:leave="transition ease-in duration-300 absolute w-full"
                x-transition:leave-start="opacity-100 translate-x-0" x-transition:leave-end="opacity-0 -translate-x-8"
                class="space-y-6">

                <div class="relative" x-data="{ open: false }">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2 ml-1">Business
                        Type</label>
                    <button type="button" @click="open = !open"
                        class="flex items-center justify-between w-full px-5 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-xl text-slate-700 font-medium hover:border-indigo-200 hover:bg-white transition-all group outline-none focus:ring-4 focus:ring-indigo-100">
                        <span x-text="formData.business_type || 'Select your niche'"
                            :class="!formData.business_type ? 'text-slate-400' : 'text-slate-900'"></span>
                        <i
                            class="ph-bold ph-caret-down text-slate-400 group-hover:text-indigo-600 transition-colors"></i>
                    </button>
                    <div x-show="open" @click.away="open = false" x-transition.opacity
                        class="absolute z-30 w-full mt-2 bg-white border border-slate-100 rounded-2xl shadow-xl max-h-60 overflow-y-auto p-1.5 custom-scrollbar">
                        <template
                            x-for="item in ['Web Developer', 'Graphic Designer', 'Consultant', 'Shop / Kirana Store', 'Restaurant', 'Tea Stall', 'Tailor', 'Gig Worker', 'Other']">
                            <button type="button" @click="formData.business_type = item; open = false"
                                class="w-full px-4 py-2.5 text-left text-sm font-medium rounded-xl hover:bg-indigo-50 hover:text-indigo-700 transition-colors"
                                x-text="item"></button>
                        </template>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2 ml-1">Legal
                        Structure</label>
                    <div class="grid grid-cols-1 gap-3">
                        <template x-for="opt in ['Individual Freelancer', 'Sole Proprietorship', 'Partnership']">
                            <button type="button" @click="formData.legal_structure = opt"
                                :class="formData.legal_structure === opt ? 'border-indigo-500 bg-indigo-50 text-indigo-700 shadow-md shadow-indigo-100 ring-1 ring-indigo-500' : 'border-slate-100 bg-slate-50 text-slate-500 hover:border-indigo-200 hover:bg-white'"
                                class="flex items-center gap-4 px-5 py-3.5 border-2 rounded-xl transition-all text-sm group">
                                <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors"
                                    :class="formData.legal_structure === opt ? 'border-indigo-600 bg-indigo-600' : 'border-slate-300'">
                                    <div class="w-2 h-2 rounded-full bg-white transform scale-0 transition-transform"
                                        :class="formData.legal_structure === opt ? 'scale-100' : ''"></div>
                                </div>
                                <span class="font-bold" x-text="opt"></span>
                            </button>
                        </template>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2 ml-1">Business
                        Name</label>
                    <div class="relative group">
                        <i
                            class="ph-bold ph-storefront absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-indigo-500 transition-colors text-lg"></i>
                        <input type="text" x-model="formData.business_name" placeholder="Trade name"
                            class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-xl outline-none focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100 transition-all font-medium text-slate-900 placeholder:text-slate-400">
                    </div>
                </div>
            </div>

            <!-- Step 2: Operations -->
            <div x-show="step === 2" x-transition:enter="transition ease-out duration-500 delay-200"
                x-transition:enter-start="opacity-0 translate-x-8" x-transition:enter-end="opacity-100 translate-x-0"
                x-transition:leave="transition ease-in duration-300 absolute w-full"
                x-transition:leave-start="opacity-100 translate-x-0" x-transition:leave-end="opacity-0 -translate-x-8"
                class="space-y-6">

                <div class="grid grid-cols-2 gap-5">
                    <div>
                        <label
                            class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2 ml-1">Commencement
                            Date</label>
                        <input type="date" x-model="formData.commencement_date"
                            class="w-full px-4 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-xl outline-none focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100 transition-all font-medium text-slate-600">
                    </div>
                    <div>
                        <label
                            class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2 ml-1">Employees</label>
                        <div class="relative">
                            <select x-model="formData.employees_count"
                                class="w-full px-4 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-xl outline-none focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100 transition-all font-medium text-slate-900 appearance-none">
                                <option value="0">Self only (0)</option>
                                <option value="1-5">1–5</option>
                                <option value="6-10">6–10</option>
                                <option value="10+">10+</option>
                            </select>
                            <i
                                class="ph-bold ph-caret-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-5">
                    <div>
                        <label
                            class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2 ml-1">State</label>
                        <input type="text" x-model="formData.state" placeholder="State"
                            class="w-full px-4 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-xl outline-none focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100 transition-all font-medium text-slate-900 placeholder:text-slate-400">
                    </div>
                    <div>
                        <label
                            class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2 ml-1">District</label>
                        <input type="text" x-model="formData.district" placeholder="District"
                            class="w-full px-4 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-xl outline-none focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100 transition-all font-medium text-slate-900 placeholder:text-slate-400">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2 ml-1">Mode of
                        Sales</label>
                    <div class="grid grid-cols-1 gap-2">
                        <template
                            x-for="mode in [{id:'local', label:'Local Only'}, {id:'interstate', label:'Inter-state'}, {id:'international', label:'International'}, {id:'online', label:'Online'}]">
                            <button type="button" @click="formData.mode_of_sales =  mode.id"
                                :class="formData.mode_of_sales ===  mode.id ? 'border-indigo-500 bg-indigo-50 text-indigo-700 shadow-md shadow-indigo-100 ring-1 ring-indigo-500' : 'border-slate-100 bg-slate-50 text-slate-500 hover:border-indigo-200 hover:bg-white'"
                                class="flex items-center gap-4 px-5 py-3 border-2 rounded-xl transition-all text-sm group">
                                <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors"
                                    :class="formData.mode_of_sales === mode.id ? 'border-indigo-600 bg-indigo-600' : 'border-slate-300'">
                                    <div class="w-2 h-2 rounded-full bg-white transform scale-0 transition-transform"
                                        :class="formData.mode_of_sales === mode.id ? 'scale-100' : ''"></div>
                                </div>
                                <span class="font-bold" x-text="mode.label"></span>
                            </button>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Step 3: Financials -->
            <div x-show="step === 3" x-transition:enter="transition ease-out duration-500 delay-200"
                x-transition:enter-start="opacity-0 translate-x-8" x-transition:enter-end="opacity-100 translate-x-0"
                x-transition:leave="transition ease-in duration-300 absolute w-full"
                x-transition:leave-start="opacity-100 translate-x-0" x-transition:leave-end="opacity-0 -translate-x-8"
                class="space-y-6">

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2 ml-1">Annual
                        Turnover</label>
                    <div class="relative group">
                        <i
                            class="ph-bold ph-currency-inr absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-indigo-500 transition-colors text-lg"></i>
                        <select x-model="formData.annual_turnover"
                            class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-xl outline-none focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100 transition-all font-medium text-slate-900 appearance-none">
                            <option value="<10">Less than ₹10 lakh</option>
                            <option value="10-20">₹10–20 lakh</option>
                            <option value="20-40">₹20–40 lakh</option>
                            <option value="40-100">₹40 lakh–₹1 crore</option>
                            <option value=">100">Above ₹1 crore</option>
                        </select>
                        <i
                            class="ph-bold ph-caret-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2 ml-1">Existing
                        Loans</label>
                    <div class="grid grid-cols-1 gap-3">
                        <template x-for="loan in ['None', 'Business', 'Personal']">
                            <button type="button" @click="formData.existing_loans = loan"
                                :class="formData.existing_loans ===  loan ? 'border-indigo-500 bg-indigo-50 text-indigo-700 shadow-md shadow-indigo-100 ring-1 ring-indigo-500' : 'border-slate-100 bg-slate-50 text-slate-500 hover:border-indigo-200 hover:bg-white'"
                                class="flex items-center gap-4 px-5 py-3.5 border-2 rounded-xl transition-all text-sm group">
                                <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors"
                                    :class="formData.existing_loans === loan ? 'border-indigo-600 bg-indigo-600' : 'border-slate-300'">
                                    <div class="w-2 h-2 rounded-full bg-white transform scale-0 transition-transform"
                                        :class="formData.existing_loans === loan ? 'scale-100' : ''"></div>
                                </div>
                                <span class="font-bold" x-text="loan"></span>
                            </button>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Step 4: Readiness -->
            <div x-show="step === 4" x-transition:enter="transition ease-out duration-500 delay-200"
                x-transition:enter-start="opacity-0 translate-x-8" x-transition:enter-end="opacity-100 translate-x-0"
                x-transition:leave="transition ease-in duration-300 absolute w-full"
                x-transition:leave-start="opacity-100 translate-x-0" x-transition:leave-end="opacity-0 -translate-x-8"
                class="space-y-4">

                <template x-for="field in [
                    { label: 'PAN Card Available?', key: 'pan_available' },
                    { label: 'Registered for GST?', key: 'gstin_available' },
                    { label: 'Udyam Registered?', key: 'udyam_registered' },
                    { label: 'Business Bank Account?', key: 'business_bank_account' },
                    { label: 'Digital Payments?', key: 'digital_payments_enabled' },
                    { label: 'Filed ITR?', key: 'previous_itr_filed' }
                ]">
                    <div
                        class="flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-100 hover:border-slate-200 transition-colors">
                        <span class="text-sm font-bold text-slate-700" x-text="field.label"></span>
                        <div class="flex bg-slate-200 rounded-lg p-1 relative">
                            <!-- Sliding background could be improved with dynamic calc, keeping simple for now -->
                            <button type="button" @click="formData[field.key] = 'Yes'"
                                :class="formData[field.key] === 'Yes' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'"
                                class="px-3 py-1 text-xs font-bold rounded-md transition-all">YES</button>
                            <button type="button" @click="formData[field.key] = 'No'"
                                :class="formData[field.key] === 'No' ? 'bg-white text-rose-500 shadow-sm' : 'text-slate-500 hover:text-slate-700'"
                                class="px-3 py-1 text-xs font-bold rounded-md transition-all">NO</button>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Action Buttons -->
            <div class="mt-auto pt-8 flex gap-4 z-10">
                <button type="button" x-show="step > 1" @click="step--"
                    class="flex-1 py-3.5 text-slate-500 font-bold text-sm bg-white border border-slate-200 rounded-xl hover:bg-slate-50 hover:text-slate-700 hover:border-slate-300 transition-all">
                    BACK
                </button>
                <button type="button" x-show="step < 4" @click="step++"
                    class="flex-[2] py-3.5 bg-indigo-600 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-200 hover:bg-indigo-700 hover:shadow-indigo-300 hover:-translate-y-0.5 active:translate-y-0 transition-all flex items-center justify-center gap-2">
                    NEXT STEP <i class="ph-bold ph-arrow-right"></i>
                </button>
                <button type="submit" x-show="step === 4" :disabled="loading"
                    class="flex-[2] py-3.5 bg-emerald-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-emerald-200 hover:bg-emerald-600 hover:shadow-emerald-300 hover:-translate-y-0.5 active:translate-y-0 disabled:opacity-70 disabled:pointer-events-none transition-all flex items-center justify-center gap-2">
                    <span x-text="loading ? 'SAVING PROFILE...' : 'COMPLETE SETUP'"></span>
                    <i x-show="!loading" class="ph-bold ph-check"></i>
                </button>
            </div>

        </form>
    </div>
</section>

<script>
function multiStepOnboarding() {
    return {
        step: 1, loading: false,
        formData: {
            business_type: '', legal_structure: '', business_name: '',
            commencement_date: '', employees_count: '0', state: '', district: '',
            mode_of_sales: 'local', annual_turnover: '<10', nature_of_income: 'Services',
            income_frequency: 'Regular', existing_loans: 'None',
            pan_available: 'No', gstin_available: 'No', udyam_registered: 'No',
            business_bank_account: 'No', digital_payments_enabled: 'No', previous_itr_filed: 'No'
        },
        get progress() { return (this.step / 4) * 100 },
        stepTitle() { return ['About You', 'Operations', 'Financials', 'Readiness'][this.step - 1] },
        async submitForm() {
            this.loading = true;
            try {
                const response = await fetch('/profile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(this.formData)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    window.location.href = result.redirect || '/dashboard';
                } else {
                    alert(result.message || 'Something went wrong. Please check your data.');
                }
            } catch (err) {
                console.error("Submission error:", err);
                alert('Connection error. Is the server running?');
            } finally {
                this.loading = false;
            }
        }
    }
}

</script>
{% endblock %}
